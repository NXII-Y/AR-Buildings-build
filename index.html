<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Buildings</title>
    <!-- Шрифт интерфейса TT Firs Neue (src/fonts/, в репозитории).
         Подключаем до JS, чтобы шрифт был уже на стартовом экране. -->
    <style>
        body { margin: 0; overflow: hidden; background: #0d1117; }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
        /* Стартовый экран загрузки. Разметка живёт прямо в index.html, чтобы
           экран был виден с первого кадра — до загрузки бандла и движка 8th
           Wall (это занимает несколько секунд на мобильной сети). Управляет
           им src/boot-loader.js.

           z-index намеренно ниже 888: на iOS поверх приложения открывается
           поп-ап движка 8th Wall «AR requires access to device motion
           sensors» (z-index 888), и он должен оставаться видимым и
           нажимаемым, если запуск всё же дошёл до него. Свой UI приложения
           живёт на z-index не выше 170. */
        #boot-loader {
            position: fixed;
            inset: 0;
            z-index: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 24px;
            box-sizing: border-box;
            background: #0d1117;
            font-family: var(--ui-font);
            transition: opacity 0.35s ease;
        }
        #boot-loader.boot-loader--hidden {
            opacity: 0;
            pointer-events: none;
        }
        .boot-loader__spinner {
            width: 56px;
            height: 56px;
            border: 4px solid rgba(255, 255, 255, 0.25);
            border-top-color: #bd1a22;
            border-radius: 50%;
            animation: boot-loader-spin 0.8s linear infinite;
        }
        /* Ошибка: спиннер больше не нужен, показываем текст и кнопку */
        #boot-loader.boot-loader--error .boot-loader__spinner {
            display: none;
        }
        .boot-loader__text {
            max-width: 340px;
            color: #fff;
            font-size: 15px;
            font-weight: 500;
            line-height: 1.4;
            text-align: center;
            white-space: pre-wrap;
        }
        #boot-loader.boot-loader--error .boot-loader__text {
            color: #ff6b6b;
        }
        /* Кнопки стартового экрана: «Обновить» показывается при ошибке,
           «Продолжить» — на iOS перед запросом доступа к датчикам движения
           (Apple отдаёт их только из жеста пользователя, см. main.js). */
        .boot-loader__button {
            padding: 10px 22px;
            border: 0;
            border-radius: 22px;
            background: #bd1a22;
            color: #fff;
            font: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .boot-loader__button[hidden] {
            display: none;
        }
        .boot-loader__button:active {
            background: #9c141b;
        }
        @keyframes boot-loader-spin {
            to { transform: rotate(360deg); }
        }
        @media (prefers-reduced-motion: reduce) {
            /* Вращение не выключаем совсем: замерший спиннер выглядит как
               зависшее приложение. Сильно замедляем. */
            .boot-loader__spinner { animation-duration: 2.4s; }
        }
    </style>
  <script type="module" crossorigin src="/AR-Buildings-build/assets/index-BxkkMV3G.js"></script>
  <link rel="stylesheet" crossorigin href="/AR-Buildings-build/assets/index-CZP5ye7K.css">
</head>
<body>
    <div id="boot-loader" role="status" aria-live="polite">
        <div class="boot-loader__spinner"></div>
        <div class="boot-loader__text">Загрузка…</div>
        <button class="boot-loader__button boot-loader__continue" type="button" hidden>Продолжить</button>
        <button class="boot-loader__button boot-loader__retry" type="button" hidden>Обновить</button>
    </div>
    <script src="./external/xr/xr.js" async data-preload-chunks="slam"></script>
</body>
</html>
